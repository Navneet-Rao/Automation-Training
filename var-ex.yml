---
- name: Configure BGP using Jinja2 template
  hosts: usa
  connection: network_cli
  gather_facts: no
  vars_files:
    - bgp_vars.yml

  tasks:
    - name: Render BGP configuration to a local file
      ansible.builtin.template:
        src: bgp.j2
        dest: /tmp/bgp_config.txt
      delegate_to: localhost        # ✅ Render locally (control node)

    - name: Apply rendered BGP configuration on router
      cisco.ios.ios_config:
        src: /tmp/bgp_config.txt    # ✅ Push from control node to router
